# ─────────────────────────────────────────────────────────────
# MAA PC 端（Win32）的硬性要求 —— 从 MAA.dll 内嵌的官方说明里挖出来的，
# 六条里少一条都跑不起来（每一条都是实测踩过的）：
#   1. 必须以管理员身份启动（否则 UIPI 拦掉所有窗口消息，MAA 日志 error=5）
#   2. 游戏分辨率需为 16:9，且是标准值（1280x720 或 1920x1080）——
#      非标准尺寸时 MAA 报 "Cannot create controller proxy: Unsupported resolution"
#      注意：改过系统显示缩放后，要重启游戏让窗口按新缩放重建，否则会卡在旧尺寸
#   3. UI 缩放需设为 100%（Windows 设置 → 显示 → 缩放与布局）
#   4. 鼠标输入方式推荐 PostMsg-WindowPos（全后台、不抢鼠标、按窗口坐标投递，
#      不需要 SetCursorPos，因此不会出现坐标越界）
#   5. 截图方式：打印窗口用 PrintWindow；FramePool 会话会失效返回全黑图，需重新附着
#   6. 部分截图方式下，游戏窗口不能最小化
# ─────────────────────────────────────────────────────────────[plugin]
enabled = true
config_version = "0.1.0"

[maa]
# MAA 安装目录（需含 MaaCore.dll 与 Python/asst 绑定）
maa_dir = "D:\\MAA"
# 游戏窗口标题（PC 客户端就是「明日方舟」）
window_title = "明日方舟"
# 截图方式：2=FramePool 是实测唯一完整干净且抗遮挡的；
#   1=GDI 抓到的是压在游戏上的别的窗口 · 8=DXGI桌面 被遮挡处会串窗 · 16=PrintWindow 游戏拒绝(error 5)
screencap_method = 2
# 输入方式（这个值是三轮排查换来的，改动前先看下面）：
#
#   1 = Seize                        真实输入(SendInput)。**发给前台窗口**——
#                                    挂机时你若在用别的程序，点击全跑到那个窗口去了。
#                                    实测：提权后跑 Fight，同一个按钮点了 12 次游戏没反应，
#                                    最后 TaskChainError（游戏窗口不是前台）。
#  64 = PostMessageWithCursorPos     先把光标移到目标位置再投递消息。**不需要窗口在前台**，
#                                    挂机时能正常用电脑。前提是进程权限不低于游戏（见下）。
#   2/4/32 = SendMessage / PostMessage / SendMessageWithCursorPos   同理，风格差异
#
# 权限前提：明日方舟 PC 客户端进程完整性级别高于普通进程，Windows 的 UIPI 会拦掉
# 所有跨级别窗口消息（MAA 日志里是 Failed to PostMessageA ... error=5）。
# 所以**必须让 MaiBot 以管理员身份运行**（启动一体化.bat 已加自动提权），
# 否则 64 用不了、只能用 1（且 1 还要求游戏在前台）。
#
# 实测对照：
#   未提权 + 1  → 无 error=5，但任务 18 秒就结束、游戏不进关卡
#   已提权 + 1  → **error=5 完全消失**（UIPI 解决），但 Seize 仍因窗口非前台点不进去
#   已提权 + 64 → 预期可用（不需前台），待主人实测
input_method = 64
# 没说关卡时用哪个（空 = 用游戏内当前/上次关卡）
default_stage = ""
# 单次挂机次数上限（防手滑写错，比如想打3次写成3000）
max_times = 200
connect_timeout_sec = 30.0

[report]
# 长挂机每隔多少分钟汇报一次进度
long_task_minutes = 30
# 清日常时每个子任务完成即报
report_sub_tasks = true
# 汇报里带掉落信息
report_drops = true
