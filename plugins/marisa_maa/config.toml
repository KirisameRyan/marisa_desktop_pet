[plugin]
enabled = true
config_version = "0.1.0"

[maa]
# MAA 安装目录（需含 MaaCore.dll 与 Python/asst 绑定）
maa_dir = "D:\\MAA"
# 游戏窗口标题（PC 客户端就是「明日方舟」）
window_title = "明日方舟"
# 截图方式：2=FramePool 是实测唯一完整干净且抗遮挡的；
#   1=GDI 抓到的是压在游戏上的别的窗口 · 8=DXGI桌面 被遮挡处会串窗 · 16=PrintWindow 游戏拒绝(error 5)
screencap_method = 2
# 输入方式（这是个坑里爬出来的结论，别随便改）：
#
#   1 = Seize          真实输入（SendInput）。**不受 UIPI 限制**，代价是接管鼠标键盘。
#   2 = SendMessage    靠窗口消息投递
#   4 = PostMessage    同上
#  32 = SendMessageWithCursorPos   先移光标再投递（看似优雅，但**同样被 UIPI 拦**）
#  64 = PostMessageWithCursorPos   同上
#
# 实测：本机明日方舟 PC 客户端进程的完整性级别高于 MaiBot（非管理员），
# Windows 的 UIPI 会拦下所有跨完整性级别的窗口消息，MAA 日志明确报
#   Failed to PostMessageA [message=512][wParam=1][error=5]   ← 5 = ACCESS_DENIED
# PrintWindow 截图失败(error 5) 也是同一个原因，不是"游戏反截图"。
# 所以 2/4/32/64 在本机一律无效（点击进了空气，游戏纹丝不动）。
#
# **想让 2/4/32/64 生效，就把 MaiBot 以管理员身份运行**（届时推荐 64，不抢鼠标）。
# 不提权的话只能用 1（Seize）。
input_method = 1
# 没说关卡时用哪个（空 = 用游戏内当前/上次关卡）
default_stage = ""
# 单次挂机次数上限（防手滑写错，比如想打3次写成3000）
max_times = 200
connect_timeout_sec = 30.0

[report]
# 长挂机每隔多少分钟汇报一次进度
long_task_minutes = 30
# 清日常时每个子任务完成即报
report_sub_tasks = true
# 汇报里带掉落信息
report_drops = true
