# ─────────────────────────────────────────────────────────────
# MAA PC 端（Win32）接入说明 —— 全部来自实测与 MAA 官方文档/DLL 内嵌说明
#
# 【硬性要求】少一条都跑不起来：
#   1. 必须以管理员身份启动（否则 UIPI 拦掉所有窗口消息，MAA 日志报 error=5）
#      —— 官方第 1 条要求，启动一体化.bat 已加自动提权
#   2. 游戏分辨率必须是标准 16:9（1280x720 或 1920x1080）
#      非标准尺寸 MAA 报 "Cannot create controller proxy: Unsupported resolution"
#      改过系统显示缩放后要重启游戏让窗口按新缩放重建，否则会卡在旧尺寸
#   3. UI 缩放需设为 100%（设置 → 显示 → 缩放与布局）
#   4. 游戏窗口不能最小化（部分截图方式下）
#
# 【截图】PrintWindow=16 是官方要求，提权后可用
#   FramePool=2 会话会失效返回全黑图（3000+ 字节的全黑 PNG），需重新附着
#
# 【鼠标】64=PostMessageWithCursorPos（推荐，同主人 MAA GUI 的 MouseMethod）
#   256=PostMessageWithWindowPos 虽是官方文档推荐，但它靠**移动游戏窗口**实现，
#   MAA 自己的说明都写着"窗口会乱飞，建议最小化"——实测挂机后游戏再也打不开
#   （一点开就被 MAA 的控制器最小化）。16.. 之外的坑见 input_method 注释
# ─────────────────────────────────────────────────────────────

[plugin]
enabled = true
config_version = "0.1.0"

[maa]
# MAA 安装目录（需含 MaaCore.dll 与 Python/asst 绑定）
maa_dir = "D:\\MAA"
# 游戏窗口标题（PC 客户端就是「明日方舟」）
window_title = "明日方舟"

# 截图方式
#   16 = PrintWindow   官方要求；提权后可用，画面完整干净 ← 用这个
#    2 = FramePool     会话会失效返回全黑图，会导致 MAA"什么都看不见"而空转
#    1 = GDI           实测抓到的是压在游戏上的别的窗口
#    8 = DXGI桌面      被遮挡处会串窗
screencap_method = 16

# 鼠标输入方式
#   64 = PostMessageWithCursorPos  ← 用这个
#        把光标移到目标再投递消息，用完还原光标，**不移动游戏窗口**。
#        主人 MAA GUI 的 Win32Extra.MouseMethod 就是这个值。
#  256 = PostMessageWithWindowPos
#        靠移动游戏窗口实现投递；MAA 说明原话"窗口会乱飞，建议最小化"，
#        实测后果：挂机结束后游戏窗口被控制器拿住，主人手动打开就被立刻最小化。
#    1 = Seize
#        SendInput 真实输入，发给**前台窗口**——挂机时你在用别的程序，
#        点击就全跑到那个窗口去了。且会抢走鼠标键盘。
#
# 实测对照（排查记录）：
#   未提权 + 1        → 无 error=5，但任务 18 秒结束、游戏不进关卡
#   已提权 + 1        → error=5 消失（UIPI 解决），但 Seize 因窗口非前台点不进去
#   已提权 + 64       → SetCursorPos 越界（当时缩放/分辨率都不对）
#   已提权 + 256      → 能跑通 RA-4，但窗口被霸占
#   已提权 + 64（缩放100% + 标准分辨率后）→ 预期不再越界
input_method = 64

# 键盘输入方式：2 = SendMessage（与主人 MAA GUI 的 KeyboardMethod 一致）
keyboard_method = 2

# 没说关卡时用哪个（空 = 用游戏内当前/上次关卡）
default_stage = ""
# 单次挂机次数上限（防手滑写错，比如想打3次写成3000）
max_times = 200
connect_timeout_sec = 30.0

[report]
# 长挂机每隔多少分钟汇报一次进度
long_task_minutes = 30
# 清日常时每个子任务完成即报
report_sub_tasks = true
# 汇报里带掉落信息
report_drops = true
