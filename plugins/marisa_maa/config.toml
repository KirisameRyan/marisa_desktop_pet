# ─────────────────────────────────────────────────────────────
# MAA PC 端（Win32）接入说明 —— 全部来自实测与 MAA 官方文档/DLL 内嵌说明
#
# 【硬性要求】少一条都跑不起来（可用 /maa 自检 逐条检查）：
#   1. 必须以管理员身份启动（否则 UIPI 拦掉所有窗口消息，MAA 日志报 error=5）
#      —— 官方第 1 条要求，启动一体化.bat 已加自动提权
#   2. 游戏分辨率必须是标准 16:9（1280x720 或 1920x1080）
#      非标准尺寸 MAA 报 "Cannot create controller proxy: Unsupported resolution"
#      改过系统显示缩放后要重启游戏让窗口按新缩放重建，否则会卡在旧尺寸
#   3. UI 缩放需设为 100%（设置 → 显示 → 缩放与布局）
#   4. 游戏窗口不能最小化（部分截图方式下）
#
# 【截图】16=PrintWindow ← 当前采用（提权后可用，实测完整干净）
#   历史结论：FramePool(2) 会话会失效返回全黑图，需要重新附着，已弃用
#
# 【鼠标】1=Seize ← 当前采用（SendInput 真实输入，点击 100% 可靠）
#   前提：游戏窗口保持前台（插件自动维持，挂机中每 15 秒复查拉回）；
#   挂机期间电脑不能正常用鼠标键盘——要用就先 /maa 停
#   历史：64=PostMessageWithCursorPos 大部分时候有效，但实跑肉鸽偶发点击不被
#   游戏接收（卡确认按钮，重试 20 次全失效）；2/4 纯投递对游戏无效
# ─────────────────────────────────────────────────────────────

[plugin]
enabled = true
config_version = "0.4.1"

[maa]
# MAA 安装目录（需含 MaaCore.dll 与 Python/asst 绑定）
maa_dir = "D:\\MAA"
# 游戏窗口标题（PC 客户端就是「明日方舟」）
window_title = "明日方舟"

# 截图方式
#   16 = PrintWindow   当前采用；提权后完整干净 ← 用这个
#    2 = FramePool     会话会失效返回全黑图，会导致 MAA"什么都看不见"而空转（弃用）
#    1 = GDI           实测抓到的是压在游戏上的别的窗口
#    8 = DXGI桌面      被遮挡处会串窗
screencap_method = 16

# 鼠标输入方式
#    1 = Seize  ← 当前采用（2026-10-12 起）
#        SendInput 真实输入：点击 100% 可靠。之前用 64 时实跑黑流肉鸽，
#        偶发点击不被游戏接收（卡在"确认放弃/分队确认"按钮上，重试 20 次全失效），
#        两轮挂机各卡死一次——这就是换回 Seize 的原因。
#        前提：游戏窗口保持前台（插件自动拉回，挂机中每 15 秒复查）、
#        挂机期间电脑不能正常用鼠标键盘（操作会被抢回，也可能干扰挂机）。
#   64 = PostMessageWithCursorPos（旧方案）
#        把光标移到目标再投递、用完还原；大部分时候有效但偶发点击失效（见上）。
#  256 = PostMessageWithWindowPos
#        靠移动游戏窗口实现投递；MAA 说明原话"窗口会乱飞，建议最小化"，
#        实测后果：挂机结束后游戏窗口被控制器拿住，主人手动打开就被立刻最小化。
#    2/4 = SendMessage / PostMessage 纯投递：MAA 日志显示点击"成功"但游戏纹丝不动
input_method = 1

# 键盘输入方式：2 = SendMessage（与主人 MAA GUI 的 KeyboardMethod 一致）
keyboard_method = 2

# 没说关卡时用哪个（空 = 用游戏内当前/上次关卡）
default_stage = ""
# 单次挂机次数上限（防手滑写错，比如想打3次写成3000）
max_times = 200
connect_timeout_sec = 30.0

# 单次挂机总时长上限（分钟）。到时强制停止并销毁实例、把鼠标/窗口交还——
# 防止任务卡死时 MAA 的 Win32 控制器整夜占用光标（0=不限制）
max_run_minutes = 240

# 刷关连战倍率（游戏内代理指挥倍率 1-10）：说明白点就是"刷几轮=倍率几"
#   -2 = 跟随轮数（默认）：刷十轮 → 10 连战一次进出打完，而不是进出十次
#    0 = MAA 自动：按剩余理智选最大倍率
#   -1 = 不切换：保持游戏里当前的手动设置
#   1~10 = 固定倍率（比如永远 6 连战）
fight_series = -2

# 基建换班方式：
#   rotation = 按游戏内置的基建排班队列换班（默认，主人要求"使用队列更换"）
#   default  = MAA 逐个设施自动挑人（"一个一个选"）
infrast_mode = "rotation"

# 自动肉鸽（黑流树海）—— /maa 肉鸽 时使用；游戏停哪都行，自动从首页导航进入
# （进图后由官方限时链接管：特勤分队/稳扎稳打/机械师，循环 进入→投资→放弃→重开）
# 主题（BlackFlow = 黑流树海）
roguelike_theme = "BlackFlow"
# 策略三选一：exp = 刷等级（默认）· investment = 刷源石锭 · baby_animal = 刷幼兽
roguelike_mode = "exp"
# 难度（主人选 2 级；-1 = 不切换）
roguelike_difficulty = 2
# 开局分队（主人选特勤分队）
roguelike_squad = "特勤分队"
# 职业组（主人选稳扎稳打）
roguelike_roles = "稳扎稳打"
# 开局干员（主人选机械师；空字符串 = 不指定）
roguelike_core_char = "机械师"

# 生息演算（RA）模式：0=RA-1 · 1=RA-4 · 2=RA-15
# （插件内部会映射成 MaaCore 的 flags 值 16/48/32，不用自己填）
ra_mode = 1
# 生息演算单次最大制造轮数（同 MAA GUI 默认 16）
ra_craft_batches = 16
# 生息演算自动导航：先回主界面、再自动进入 RA 大地图（用插件自带的任务链，需游戏开着）。
# 实机验证通过（约 20 秒进入）。关闭后要求游戏已手动停在大地图对应关卡、
# 右下角出现「开启建设」。
auto_enter_ra = true

[report]
# 长挂机每隔多少分钟汇报一次进度
long_task_minutes = 30
# 清日常时每个子任务完成即报
report_sub_tasks = true
# 汇报里带掉落信息
report_drops = true
# 挂机结束（完成/出错/超时强停）时自动补一张游戏画面截图发到汇报会话
report_screenshot = true

[post_action]
# 挂机全部完成后的收尾动作（对应 MAA GUI 的「完成后操作」，任务完成→汇报截图发完→再执行）：
#   none=不执行（默认）· shutdown=关机 · sleep=睡眠 · hibernate=休眠 · lock=锁屏
# 也可以在指令里临时说「/maa 刷十轮1-7 刷完关机」，单轮有效，不落配置
action = "none"
# 关机/睡眠前的缓冲秒数（期间可以发「/maa 取消关机」取消）
delay_sec = 60
# 有任务链出错时跳过完成后动作（默认开，防止挂失败了还关机）
skip_on_error = true
